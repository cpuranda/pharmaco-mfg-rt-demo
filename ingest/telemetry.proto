// Zerobus Ingest target schema for the PharmaCo MFG RT demo bronze table.
// Field names MUST match the Delta columns in
// hls_streaming_solution_demo_catalog.pharmaco_mfg_rt_bronze.telemetry_raw
//
// Type mapping (per Zerobus SDK generate_proto):
//   STRING    -> string
//   DOUBLE    -> double
//   BIGINT    -> int64
//   TIMESTAMP -> int64  (MICROSECONDS since epoch)
//
// proto2 + optional fields => nullable Delta columns.
syntax = "proto2";

message TelemetryRecord {
  optional string event_id = 1;
  optional string source_event_id = 2;
  optional int64  event_ts = 3;         // micros since epoch
  optional int64  ingested_ts = 4;      // micros since epoch
  optional string site_id = 5;
  optional string plant_id = 6;
  optional string line_id = 7;
  optional string asset_id = 8;
  optional string batch_id = 9;
  optional string product_family = 10;
  optional string sensor_type = 11;
  optional double sensor_value = 12;
  optional string unit = 13;
  optional string operating_state = 14;
  optional double nominal_min = 15;
  optional double nominal_max = 16;
  optional int64  sequence_number = 17;
  optional string scenario = 18;
  optional string payload_version = 19;
  optional string ingest_source = 20;
  optional string ingest_batch_id = 21;
}
